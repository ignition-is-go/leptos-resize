name: Workflow validation

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - action.yml
      - action.yaml

permissions:
  contents: read

jobs:
  validate:
    uses: ignition-is-go/pulse-actions/.github/workflows/validate-workflows.yml@v1.1.1 # v1.0.0
    with:
      runner-json: '["self-hosted","Linux","X64","ram-ge-16g","disk-ge-100g"]'
