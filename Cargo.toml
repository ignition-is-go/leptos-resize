[package]
name = "leptos-resize"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reusable drag-resize handle component for Leptos UIs. Shared primitive for pulse-leptos-ui and mullion."
repository = "https://github.com/ignition-is-go/leptos-resize"

[dependencies]
leptos = { version = "0.8.17", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Document",
    "Element",
    "EventTarget",
    "HtmlElement",
    "MouseEvent",
    "Window",
    "CssStyleDeclaration",
] }

[workspace]
